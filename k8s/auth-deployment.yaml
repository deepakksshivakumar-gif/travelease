apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: travelease

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: auth-service

          image: 336359748141.dkr.ecr.us-east-1.amazonaws.com/travelease/auth-service:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3001

          envFrom:
            - configMapRef:
                name: auth-config

            - secretRef:
                name: auth-secret

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "200m"

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
